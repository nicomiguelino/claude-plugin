name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate tag is SemVer and matches plugin version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if ! [[ "$TAG" =~ $semver ]]; then
            echo "::error::Tag '$TAG' is not a valid SemVer tag (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          version=$(jq -er '.version' .claude-plugin/plugin.json)
          if [[ "v$version" != "$TAG" ]]; then
            echo "::error::Tag '$TAG' does not match plugin.json version '$version'"
            exit 1
          fi

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
